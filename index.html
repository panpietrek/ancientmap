<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antyczna Mapa Aten - Precyzyjne Adresy</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap');

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Georgia', serif;
            background-color: #f4e4bc;
            overflow: hidden;
        }

        #header {
            background: linear-gradient(180deg, #2b1e16 0%, #3d2b1f 100%);
            color: #d4af37;
            text-align: center;
            padding: 6px 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-bottom: 3px solid #b8860b;
            height: 35px;
            z-index: 1000;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #header h1 {
            font-family: 'Cinzel', serif;
            margin: 0;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #top-filters {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .top-btn {
            background: #4a3525;
            color: #f4e4bc;
            border: 1px solid #b8860b;
            padding: 3px 8px;
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .top-btn.active {
            background: #b8860b;
            color: #1a100a;
            font-weight: bold;
        }

        .panel-toggle-btn {
            background: #8b5a2b;
            color: #fff;
            border: 1px solid #d4af37;
            padding: 2px 7px;
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 4px;
        }

        #main-container {
            display: flex;
            height: calc(100% - 47px);
            width: 100%;
            position: relative;
        }

        #sidebar {
            width: 220px;
            background: #f9f2e3;
            border-right: 3px solid #8b5a2b;
            padding: 8px;
            box-shadow: 3px 0 10px rgba(0,0,0,0.2);
            overflow-y: auto;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .sidebar-title {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            color: #8b0000;
            text-align: center;
            border-bottom: 2px dashed #8b5a2b;
            padding-bottom: 4px;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .day-btn {
            background: #4a3525;
            color: #f4e4bc;
            border: 1px solid #b8860b;
            padding: 7px;
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .day-btn:hover, .day-btn.active {
            background: #b8860b;
            color: #1a100a;
            font-weight: bold;
        }

        .gps-btn {
            background: #8b0000 !important;
            color: #fff !important;
            text-align: center;
            margin-top: auto;
        }

        #right-panel {
            position: absolute;
            top: 0;
            right: -280px;
            width: 260px;
            height: 100%;
            background: rgba(249, 242, 227, 0.96);
            border-left: 3px solid #8b5a2b;
            box-shadow: -5px 0 15px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: right 0.3s ease-in-out;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #right-panel.open {
            right: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #8b5a2b;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .panel-header .sidebar-title {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .close-panel-btn {
            background: #8b0000;
            color: #fff;
            border: 1px solid #d4af37;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 24px;
            height: 24px;
            line-height: 20px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
        }

        .poi-item {
            background: #fff;
            border: 1px solid #b8860b;
            border-radius: 5px;
            padding: 6px 8px;
            margin-bottom: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }

        .poi-item:hover {
            background: #f4e4bc;
        }

        .poi-item-title {
            font-family: 'Cinzel', serif;
            font-weight: bold;
            color: #8b0000;
            font-size: 0.8rem;
        }

        #map {
            flex-grow: 1;
            height: 100%;
            background: #e5d3b3;
        }

        .leaflet-tile-container {
            filter: sepia(0.4) contrast(1.05) brightness(0.95);
        }

        .leaflet-popup-content-wrapper {
            background: #f9f2e3;
            border: 2px solid #8b5a2b;
            border-radius: 6px;
            color: #2b1e16;
            font-family: 'Georgia', serif;
        }

        .popup-title {
            font-family: 'Cinzel', serif;
            font-weight: bold;
            color: #8b0000;
            font-size: 0.95rem;
            border-bottom: 1px dashed #8b5a2b;
            padding-bottom: 4px;
            margin-bottom: 4px;
        }

        .popup-tag {
            display: inline-block;
            font-size: 0.65rem;
            background: #8b5a2b;
            color: #fff;
            padding: 2px 5px;
            border-radius: 3px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .popup-desc {
            font-size: 0.8rem;
            line-height: 1.3;
            margin-bottom: 6px;
        }

        .popup-distance {
            font-size: 0.75rem;
            color: #004d40;
            font-weight: bold;
            margin-bottom: 6px;
            background: #e0f2f1;
            padding: 3px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        .nav-btn {
            display: block;
            text-align: center;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            padding: 6px;
            border-radius: 4px;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            #header {
                flex-direction: column;
                height: auto;
                padding: 6px;
                gap: 4px;
            }
            #main-container {
                flex-direction: column-reverse;
                height: calc(100% - 65px);
            }
            #sidebar {
                width: 100%;
                height: 110px;
                flex-direction: row;
                flex-wrap: wrap;
                overflow-x: auto;
                padding: 5px;
                gap: 3px;
                border-right: none;
                border-top: 3px solid #8b5a2b;
            }
            .sidebar-title {
                display: none;
            }
            .day-btn {
                flex: 1 1 45%;
                font-size: 0.65rem;
                padding: 5px;
                text-align: center;
            }
            .gps-btn {
                margin-top: 0;
            }
            #map {
                height: calc(100% - 110px);
            }
            #right-panel {
                width: 80%;
                right: -80%;
            }
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>🏛️ Antyczna Mapa Aten</h1>
        <div id="top-filters">
            <button class="top-btn active" onclick="filterByCategory('all', event)">Wszystko</button>
            <button class="top-btn" onclick="filterByCategory('hotel', event)">🏨 Hotel</button>
            <button class="top-btn" onclick="filterByCategory('sight', event)">🏺 Zabytki</button>
            <button class="top-btn" onclick="filterByCategory('food', event)">🍷 Kulinaria</button>
            <button class="panel-toggle-btn" onclick="toggleRightPanel()" title="Otwórz listę miejsc">📋 Lista</button>
        </div>
    </div>

    <div id="right-panel">
        <div class="panel-header">
            <div class="sidebar-title">Atrakcje w widoku</div>
            <button class="close-panel-btn" onclick="toggleRightPanel()" title="Zamknij listę">✖</button>
        </div>
        <div id="panel-poi-list"></div>
    </div>

    <div id="main-container">
        <div id="sidebar">
            <div class="sidebar-title">Plan Wyjazdu</div>
            <button class="day-btn active" onclick="filterByDay('all', event)">✨ Wszystkie dni</button>
            <button class="day-btn" onclick="filterByDay('day1', event)">📅 Dzień 1 (Piątek)</button>
            <button class="day-btn" onclick="filterByDay('day2', event)">📅 Dzień 2 (Sobota)</button>
            <button class="day-btn" onclick="filterByDay('day3', event)">📅 Dzień 3 (Niedziela)</button>
            <button class="day-btn" onclick="filterByDay('day4', event)">📅 Dzień 4 (Poniedziałek)</button>
            <button class="day-btn gps-btn" onclick="locateUser()">📍 Moja pozycja</button>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([37.9765, 23.7265], 15);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles © Esri'
        }).addTo(map);

        const poiList = [
            { id: 1, name: "Athens Center Square Hotel", address: "Sofokleous 15", days: ["day1", "day2", "day3", "day4"], cat: "hotel", lat: 37.9798, lng: 23.7259, desc: "Baza wypadowa. Sofokleous 15.", icon: "🏨", tag: "Hotel" },
            { id: 2, name: "Agora Ateńska & Hefajstejon", address: "Adrianou 24", days: ["day1"], cat: "sight", lat: 37.9753, lng: 23.7225, desc: "Centrum starożytnych Aten. Adrianou 24.", icon: "🏺", tag: "Dzień 1 / Zabytek" },
            { id: 3, name: "O Thanasis (Souvlaki)", address: "Mitropoleos 69", days: ["day1"], cat: "food", lat: 37.9760, lng: 23.7257, desc: "Kultowe souvlaki. Mitropoleos 69.", icon: "🥙", tag: "Dzień 1 / Kulinaria" },
            { id: 4, name: "Anafiotika & Plaka", address: "Thrasillou / Anafiotika", days: ["day1"], cat: "sight", lat: 37.9725, lng: 23.7285, desc: "Malownicza wysepka u podnóża Akropolu.", icon: "🏡", tag: "Dzień 1 / Zabytek" },
            
            { id: 5, name: "Akropol Ateński & Partenon", address: "Theorias (Wejście główne)", days: ["day2"], cat: "sight", lat: 37.9715, lng: 23.7257, desc: "Majestatyczne serce antyku. Główne wejście.", icon: "🏛️", tag: "Dzień 2 / Zabytek" },
            { id: 6, name: "Nowe Muzeum Akropolu", address: "Dionysiou Areopagitou 15", days: ["day2"], cat: "sight", lat: 37.9684, lng: 23.7285, desc: "Światowej klasy muzeum. Dionysiou Areopagitou 15.", icon: "🏛️", tag: "Dzień 2 / Zabytek" },
            { id: 7, name: "Plac Syntagma & Zmiana Warty", address: "Leof. Amalias 2 (Parlament)", days: ["day2"], cat: "sight", lat: 37.9754, lng: 23.7360, desc: "Grecki Parlament i grobowiec Nieznanego Żołnierza.", icon: "💂", tag: "Dzień 2 / Zabytek" },
            { id: 8, name: "Wzgórze Lycabettus", address: "Ploutarchou / Kolejka", days: ["day2"], cat: "sight", lat: 37.9818, lng: 23.7432, desc: "Najwyższy punkt centrum – zachód słońca.", icon: "⛰️", tag: "Dzień 2 / Zabytek" },
            { id: 9, name: "Mavros Gatos", address: "Navarchou Apostoli 4", days: ["day2"], cat: "food", lat: 37.9774, lng: 23.7229, desc: "Tradycyjna tawerna w Psiri. Navarchou Apostoli 4.", icon: "🥘", tag: "Dzień 2 / Kulinaria" },

            { id: 10, name: "Narodowe Muzeum Archeologiczne", address: "Patision 44", days: ["day3"], cat: "sight", lat: 37.9890, lng: 23.7330, desc: "Skarbiec antycznych artefaktów. Patision 44.", icon: "🏺", tag: "Dzień 3 / Zabytek" },
            { id: 11, name: "Epirus Tavern (Varvakeios)", address: "Athinas 42 (Wewnątrz hali)", days: ["day3"], cat: "food", lat: 37.9806, lng: 23.7272, desc: "Jadłodajnia w hali targowej. Domowa musaka.", icon: "🍲", tag: "Dzień 3 / Kulinaria" },
            { id: 12, name: "Stadion Panatenajski", address: "Vasileos Konstantinou 2", days: ["day3"], cat: "sight", lat: 37.9683, lng: 23.7411, desc: "Stadion z białego marmuru. Vasileos Konstantinou 2.", icon: "🏟️", tag: "Dzień 3 / Zabytek" },
            { id: 13, name: "Karamanlidika tou Fani", address: "Sokratous 1", days: ["day3"], cat: "food", lat: 37.9798, lng: 23.7252, desc: "Bizantyjskie wędliny i sery. Sokratous 1.", icon: "🍷", tag: "Dzień 3 / Kulinaria" },

            { id: 14, name: "Targ Varvakeios & Pamiątki", address: "Athinas 42", days: ["day4"], cat: "sight", lat: 37.9804, lng: 23.7270, desc: "Zakupy lokalnych specjałów. Athinas 42.", icon: "🛍️", tag: "Dzień 4 / Inne" }
        ];

        let markers = [];
        let userMarker = null;
        let userCoords = null;
        let currentDay = 'all';
        let currentCategory = 'all';

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c; 
        }

        function formatDistance(meters) {
            if (meters < 1000) {
                return Math.round(meters) + " m od Ciebie";
            } else {
                return (meters / 1000).toFixed(2) + " km od Ciebie";
            }
        }

        poiList.forEach(poi => {
            const customIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="font-size:22px; text-shadow: 2px 2px 4px rgba(0,0,0,0.6);">${poi.icon}</div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });

            const marker = L.marker([poi.lat, poi.lng], { icon: customIcon }).addTo(map);
            
            function updatePopupContent() {
                // KLUCZOWA ZMIANA: Przekazujemy nazwę i adres tekstowy zamiast współrzędnych, 
                // dzięki czemu Google Maps nie "przyciąga" błędnie do sąsiednich numerów.
                const destinationQuery = encodeURIComponent(poi.name + ", " + poi.address + ", Athens, Greece");
                const googleNavUrl = `https://www.google.com/maps/dir/?api=1&destination=${destinationQuery}`;
                
                let distanceHtml = "";
                if (userCoords) {
                    const dist = calculateDistance(userCoords.lat, userCoords.lng, poi.lat, poi.lng);
                    distanceHtml = `<div class="popup-distance">📍 ${formatDistance(dist)}</div><br>`;
                }

                return `
                    <div class="popup-title">${poi.name}</div>
                    <span class="popup-tag">${poi.tag}</span>
                    <div style="font-size: 0.75rem; color: #555; margin-bottom: 4px;">📌 <em>${poi.address}</em></div>
                    <div class="popup-desc">${poi.desc}</div>
                    ${distanceHtml}
                    <a href="${googleNavUrl}" target="_blank" class="nav-btn" title="Nawiguj">🧭</a>
                `;
            }

            marker.bindPopup(updatePopupContent());
            
            marker.on('popupopen', () => {
                marker.setPopupContent(updatePopupContent());
            });

            marker.days = poi.days;
            marker.category = poi.cat;
            marker.poiData = poi;
            markers.push(marker);
        });

        function updateRightPanel() {
            const listContainer = document.getElementById('panel-poi-list');
            listContainer.innerHTML = '';

            markers.forEach(marker => {
                const matchDay = (currentDay === 'all' || marker.days.includes(currentDay));
                const matchCat = (currentCategory === 'all' || marker.category === currentCategory);

                if (matchDay && matchCat) {
                    const item = document.createElement('div');
                    item.className = 'poi-item';
                    item.innerHTML = `<div class="poi-item-title">${marker.poiData.icon} ${marker.poiData.name}</div><div style="font-size:0.7rem; color:#666;">${marker.poiData.address}</div>`;
                    item.onclick = () => {
                        map.setView([marker.poiData.lat, marker.poiData.lng], 17);
                        marker.openPopup();
                        if(window.innerWidth <= 768) toggleRightPanel();
                    };
                    listContainer.appendChild(item);
                }
            });
        }

        function updateFilters() {
            let bounds = [];

            markers.forEach(marker => {
                const matchDay = (currentDay === 'all' || marker.days.includes(currentDay));
                const matchCat = (currentCategory === 'all' || marker.category === currentCategory);

                if (matchDay && matchCat) {
                    map.addLayer(marker);
                    bounds.push(marker.getLatLng());
                } else {
                    map.removeLayer(marker);
                }
            });

            updateRightPanel();

            if (currentDay !== 'all' && bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
            } else if (currentDay === 'all' && currentCategory === 'all') {
                map.setView([37.9765, 23.7265], 15);
            }
        }

        function filterByDay(day, evt) {
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) evt.target.classList.add('active');
            currentDay = day;
            updateFilters();
        }

        function filterByCategory(cat, evt) {
            document.querySelectorAll('.top-btn').forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) evt.target.classList.add('active');
            currentCategory = cat;
            updateFilters();
        }

        function toggleRightPanel() {
            document.getElementById('right-panel').classList.toggle('open');
        }

        function locateUser() {
            if (!navigator.geolocation) {
                alert("Twoja przeglądarka nie wspiera geolokalizacji.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    userCoords = { lat: lat, lng: lng };

                    if (userMarker) {
                        map.removeLayer(userMarker);
                    }

                    const userIcon = L.divIcon({
                        className: 'user-icon',
                        html: `<div style="font-size:24px;">🔵</div>`,
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    });

                    userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
                    userMarker.bindPopup("<b>Jesteś tutaj!</b>").openPopup();
                    map.setView([lat, lng], 16);
                },
                () => {
                    alert("Nie udało się pobrać lokalizacji. Upewnij się, że przyznałeś uprawnienia do GPS.");
                },
                { enableHighAccuracy: true }
            );
        }

        updateRightPanel();
    </script>
</body>
</html>
